<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="GA 2026 Manager Festa 초대장">
<meta property="og:description" content="2026년 11월 6일(금) ~ 7일(토), 인스파이어 리조트">
<meta property="og:type" content="website">

<title>GA 2026 Manager Festa 초대장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --peach:#F8C9AE; --blush:#EEBBD9; --lilac:#D7B6F3; --orchid:#B78CF1; --violet:#7446DA; --plum:#3B2468;
  --page:#E9D6F4; --ink:#3B2468; --ink-soft:#6B5890; --card:rgba(255,255,255,.62); --card-line:rgba(255,255,255,.85);
  --title:#FFFFFF; --title-pale:#EDE0FA; --pill:#F3E9FC;
  --sky:linear-gradient(160deg,#F8C9AE 0%,#EEBBD9 30%,#D7B6F3 62%,#B78CF1 100%);
  --cloud-a:#FFFFFF; --cloud-b:#F3C6EC;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#1E1236; --ink:#F2E8FF; --ink-soft:#BFAEDD; --card:rgba(52,32,92,.62); --card-line:rgba(190,160,240,.28);
    --title-pale:#CDB6F5; --pill:#3A2566;
    --sky:linear-gradient(160deg,#6B4A7E 0%,#5A3A86 32%,#43297A 64%,#2A1856 100%);
    --cloud-a:#CDB3F0; --cloud-b:#8F5FC8;
  }
}
:root[data-theme="dark"]{
  --page:#1E1236; --ink:#F2E8FF; --ink-soft:#BFAEDD; --card:rgba(52,32,92,.62); --card-line:rgba(190,160,240,.28);
  --title-pale:#CDB6F5; --pill:#3A2566;
  --sky:linear-gradient(160deg,#6B4A7E 0%,#5A3A86 32%,#43297A 64%,#2A1856 100%);
  --cloud-a:#CDB3F0; --cloud-b:#8F5FC8;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
.wrap{max-width:440px;margin:0 auto;position:relative;background:var(--page);overflow:hidden;min-height:100vh;box-shadow:0 0 60px rgba(90,50,160,.18)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

/* ---------- Cover ---------- */
.cover{position:relative;background:var(--sky);min-height:100svh;display:flex;flex-direction:column;justify-content:flex-start;padding:56px 28px 0;isolation:isolate}
.ribbon{position:absolute;top:-30px;left:-40px;width:170px;opacity:.9;z-index:-1}
.title{font-family:"Outfit",sans-serif;font-weight:900;line-height:.86;letter-spacing:-.01em;color:var(--title);font-size:clamp(50px,15.5vw,70px);margin:0;text-shadow:0 6px 24px rgba(120,70,200,.18)}
.title span{display:block;opacity:0;transform:translateY(40px)}
.title .yr{color:var(--title-pale)}
.title .row1{display:flex;gap:.22em;opacity:1;transform:none}
.title .row1 span{display:inline-block}
.lead{margin:22px 0 0;font-size:15px;line-height:1.7;color:var(--ink);font-weight:600;opacity:0}
.crown-stage{position:relative;margin:18px auto 150px;width:min(88%,350px);aspect-ratio:749/613;z-index:2}
.crown{width:100%;opacity:0;transform:translateY(-120vh) rotate(-24deg);filter:drop-shadow(0 26px 30px rgba(110,60,190,.35))}
.crown.landed{animation:bob 5.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(-3deg)}}
.glint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);
  -webkit-mask:var(--crown-mask) center/contain no-repeat;mask:var(--crown-mask) center/contain no-repeat;background-size:250% 100%}
.glint.run{animation:glint 1.4s ease-out forwards}
@keyframes glint{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-40% 0}}
.float-gift{position:absolute;z-index:1;filter:drop-shadow(0 12px 16px rgba(100,60,170,.25))}
.g1{width:92px;top:18px;right:-14px;animation:drift 7s ease-in-out infinite}
.g2{width:70px;top:52%;left:-12px;animation:drift 8s ease-in-out -2s infinite}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.clouds{position:absolute;left:-10%;right:-10%;bottom:-2px;height:190px;z-index:3;pointer-events:none}
.scroll-cue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--plum);opacity:0}
.scroll-cue i{width:2px;height:26px;border-radius:2px;background:currentColor;animation:cue 1.8s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- Sections ---------- */
.sheet{position:relative;background:var(--page);padding:12px 22px 64px;z-index:5}
.sec{padding:52px 0 0}
.sec h2{font-family:"Outfit","Gothic A1",sans-serif;font-weight:800;font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.sec .sub{margin:0 0 22px;color:var(--ink-soft);font-size:14px;line-height:1.6}

/* gift reveal */
.gift-box{display:block;margin:6px auto 0;border:0;background:none;padding:0;cursor:pointer;width:200px;position:relative;-webkit-tap-highlight-color:transparent}
.gift-box img{width:100%;filter:drop-shadow(0 18px 20px rgba(100,60,170,.3));transition:transform .2s}
.gift-box:focus-visible{outline:3px solid var(--violet);outline-offset:8px;border-radius:24px}
.gift-box.shake img{animation:shake .6s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.04)}40%{transform:rotate(8deg) scale(1.06)}60%{transform:rotate(-6deg) scale(1.08)}80%{transform:rotate(4deg) scale(1.1)}}
.gift-box.gone{animation:pop .45s ease-in forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.tap-hint{text-align:center;font-size:13px;color:var(--ink-soft);margin:14px 0 0}
.letter{display:none;background:var(--card);border:1px solid var(--card-line);border-radius:28px;padding:30px 24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 40px rgba(110,70,190,.14)}
.letter.show{display:block;animation:unfold .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes unfold{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.letter p{margin:0 0 14px;font-size:15.5px;line-height:1.85}
.letter .sign{margin:22px 0 0;text-align:right;font-weight:800}
.dc-bg{display:none;margin:26px 0 0;text-align:center;pointer-events:none}
.dc-bg.show{display:block;animation:dcIn 2s ease 1s both}
.dc-bg span{display:block;font-family:"Outfit",sans-serif;font-weight:800;white-space:nowrap;color:var(--violet);opacity:.45;animation:dcFloat 5.5s ease-in-out infinite}
.dc-bg .w1{font-size:12px;letter-spacing:.28em}
.dc-bg .w2{font-size:20px;line-height:1.3;letter-spacing:.08em;margin:4px auto 0;max-width:300px;white-space:normal;text-wrap:balance;animation-delay:-.6s}
@keyframes dcIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dcFloat{0%,100%{transform:translate(0,0) rotate(-1.5deg)}25%{transform:translate(6px,-9px) rotate(0deg)}50%{transform:translate(0,-16px) rotate(1.5deg)}75%{transform:translate(-6px,-7px) rotate(0deg)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dc-bg span{color:#D8C2FF}}
:root[data-theme="dark"] .dc-bg span{color:#D8C2FF}

/* info */
.info{margin:0;display:grid;grid-template-columns:78px 1fr;row-gap:0;background:var(--card);border:1px solid var(--card-line);border-radius:22px;overflow:hidden}
.info dt,.info dd{margin:0;padding:16px 0;border-top:1px solid var(--card-line);font-size:15px;line-height:1.55}
.hl{color:var(--violet);font-weight:800}
.prog li.key strong{color:var(--violet)}
.prog li.key::after{width:14px;height:14px;left:52px;top:14px;background:var(--violet);box-shadow:0 0 0 4px var(--page),0 0 0 7px rgba(116,70,218,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hl,:root:not([data-theme="light"]) .prog li.key strong{color:#D8C2FF}}
:root[data-theme="dark"] .hl,:root[data-theme="dark"] .prog li.key strong{color:#D8C2FF}
.info dt{padding-left:20px;color:var(--ink-soft);font-weight:600}
.info dd{padding-right:20px;font-weight:600;word-break:keep-all}
.info dt:first-of-type,.info dd:first-of-type{border-top:0}
.tbd{display:inline-block;background:var(--pill);color:var(--violet);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800;margin-left:4px;vertical-align:1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tbd{color:#D8C2FF}}
:root[data-theme="dark"] .tbd{color:#D8C2FF}

/* countdown */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.count div{background:var(--card);border:1px solid var(--card-line);border-radius:18px;padding:14px 0 10px}
.count b{display:block;font-family:"Outfit",sans-serif;font-size:32px;font-weight:800;line-height:1;color:var(--violet)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .count b{color:#D8C2FF}}
:root[data-theme="dark"] .count b{color:#D8C2FF}
.count small{font-size:12px;color:var(--ink-soft)}
.dday{margin:16px 0 0;text-align:center;font-size:15px;font-weight:600}

/* program */
.prog{list-style:none;margin:0;padding:0;position:relative}
.prog::before{content:"";position:absolute;left:58px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--orchid),var(--blush))}
.prog li{display:grid;grid-template-columns:44px 1fr;gap:30px;padding:10px 0;position:relative}
.prog time{font-family:"Outfit",sans-serif;font-weight:700;font-size:15px;padding-top:1px;text-align:right}
.prog li.day{display:block;padding:18px 0 4px 82px}
.prog li.day:first-child{padding-top:0}
.prog li.day h3{margin:0;font-size:14px;font-weight:800;color:var(--violet);background:var(--page);display:inline-block;padding:2px 0}
.prog li.day::after{display:none}
.prog li::after{content:"";position:absolute;left:53px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 4px var(--page)}
.prog strong{display:block;font-size:15.5px}
.prog span{display:block;word-break:keep-all;font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin-top:2px}
.prog time small{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:2px}

/* map */
.addr{background:var(--card);border:1px solid var(--card-line);border-radius:22px;padding:20px}
.addr .place{font-size:17px;font-weight:800;margin:0 0 4px;word-break:keep-all}
.addr .line{font-size:14.5px;color:var(--ink-soft);margin:0}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.btn{appearance:none;border:0;cursor:pointer;text-decoration:none;text-align:center;font:inherit;font-size:14px;font-weight:700;border-radius:14px;padding:13px 6px;background:var(--pill);color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.btn.primary{background:var(--violet);color:#fff}
.share{display:block;width:100%;margin-top:0;padding:17px;font-size:16px}
.foot{margin:36px 0 0;text-align:center;font-size:12.5px;color:var(--ink-soft);line-height:1.7}
.linkbox{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,400px);background:var(--page);border:1px solid var(--card-line);border-radius:18px;padding:16px;box-shadow:0 16px 40px rgba(60,30,120,.3);z-index:45}
.linkbox[hidden]{display:none}
.linkbox p{margin:0 0 10px;font-size:14px;font-weight:600}
.linkbox input{width:100%;font:inherit;font-size:14px;padding:11px 12px;border-radius:10px;border:1px solid var(--orchid);background:var(--card);color:var(--ink);margin-bottom:10px}
.linkbox .btn{width:100%}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--plum);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>

$('prog').innerHTML = CONFIG.program.map(g=>`<li class="day"><h3>${g.day}</h3></li>`+g.items.map(([t,e,a,b,k])=>`<li${k?' class="key"':''}><time>${t}${e?`<small>~${e}</small>`:''}</time><div><strong>${a}</strong>${b?`<span>${b}</span>`:''}</div></li>`).join('')).join('');
$('place').innerHTML = CONFIG.venue;
$('addr').innerHTML = CONFIG.address + badge('address');
$('foot').innerHTML = `주최 ${CONFIG.host}<br>GA 2026 Manager Festa`;
const q = encodeURIComponent(CONFIG.mapQuery);
$('naver').href = 'https://map.naver.com/p/search/' + q;
$('kakao').href = 'https://map.kakao.com/?q=' + q;

/* toast + share */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
function legacyCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);
  ta.select();ta.setSelectionRange(0,txt.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();return ok;
}
function showLink(txt){
  $('linkField').value=txt;$('linkBox').hidden=false;
  const f=$('linkField');f.focus();f.select();f.setSelectionRange(0,txt.length);
}
async function copy(txt,msg){
  try{await navigator.clipboard.writeText(txt);toast(msg);return}catch(e){}
  if(legacyCopy(txt)){toast(msg);return}
  showLink(txt);
}
$('copyAddr').onclick = () => copy(CONFIG.address,'주소를 복사했습니다');
$('surveyBtn').href = CONFIG.surveyUrl;
$('linkClose').onclick=()=>{$('linkBox').hidden=true};

/* countdown */
function tick(){
  if(!CONFIG.eventDate){$('dday').textContent='일정이 확정되면 카운트다운이 시작됩니다.';return}
  const diff=new Date(CONFIG.eventDate)-new Date();
  if(diff<=0){['d','h','m','s'].forEach(k=>$('cd-'+k).textContent='0');$('dday').textContent=new Date()<=new Date(CONFIG.eventEnd)?'지금 페스타가 진행 중입니다!':'함께해 주셔서 감사합니다.';return}
  const d=Math.floor(diff/864e5),h=Math.floor(diff/36e5)%24,m=Math.floor(diff/6e4)%60,s=Math.floor(diff/1e3)%60;
  $('cd-d').textContent=d;$('cd-h').textContent=h;$('cd-m').textContent=m;$('cd-s').textContent=s;
  const kst=x=>Math.floor((x.getTime()+324e5)/864e5);const dd=kst(new Date(CONFIG.eventDate))-kst(new Date());$('dday').textContent=dd===0?'D-DAY':`D-${dd}`;
}
tick(); setInterval(tick,1000);

/* confetti */
const cv=$('confetti'),cx=cv.getContext('2d');let W,H,parts=[];
const COLORS=['#7446DA','#9463EE','#B78CF1','#C9A8F7','#E7A6E4'];
function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0)}
size(); addEventListener('resize',size);
addEventListener('scroll',()=>{if(!reduce&&scrollY<H*.3&&!parts.some(p=>p.life===Infinity))ambient(Math.round(Math.min(W,440)/16))},{passive:true});
function piece(x,y,burst){return{x,y,w:6+Math.random()*8,h:10+Math.random()*12,vx:burst?(Math.random()-.5)*9:(Math.random()-.5)*.6,vy:burst?-4-Math.random()*8:.6+Math.random()*1.1,
  r:Math.random()*6.28,vr:(Math.random()-.5)*.12,c:COLORS[Math.random()*COLORS.length|0],life:burst?1:Infinity,g:burst?.18:0}}
function ambient(n){for(let i=0;i<n;i++)parts.push(piece(Math.random()*W,Math.random()*H-H,false))}
function burst(x,y,n){for(let i=0;i<n;i++)parts.push(piece(x,y,true))}
let running=false;
function loop(){
  cx.clearRect(0,0,W,H);
  parts.forEach(p=>{p.vy+=p.g;p.vx*=p.g?.985:1;p.x+=p.vx+Math.sin(p.r)*.3;p.y+=p.vy;p.r+=p.vr;if(p.life!==Infinity)p.life-=.006;
    if(p.life===Infinity&&p.y>H+20){if(scrollY>H*.55){p.life=0}else{p.y=-20;p.x=Math.random()*W}}
    cx.save();cx.globalAlpha=Math.max(0,Math.min(1,p.life))*.9;cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.r*1.3));cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<H+60);
  requestAnimationFrame(loop);
}
if(!reduce){ambient(Math.round(Math.min(W,440)/16));loop();running=true}

/* intro sequence: crown drops, title rises, glint */
const crown=$('crown');
const stage=document.querySelector('.crown-stage');
stage.style.setProperty('--crown-mask',`url(${crown.src})`);
function intro(){
  const spans=[...document.querySelectorAll('.title span:not(.row1)')];
  if(reduce){crown.style.opacity=1;crown.style.transform='rotate(-6deg)';spans.forEach(s=>{s.style.opacity=1;s.style.transform='none'});$('lead').style.opacity=1;$('cue').style.opacity=1;return}
  crown.animate([{opacity:1,transform:'translateY(-120vh) rotate(-24deg)'},{opacity:1,transform:'translateY(18px) rotate(-2deg)',offset:.72},{opacity:1,transform:'translateY(-8px) rotate(-8deg)',offset:.86},{opacity:1,transform:'translateY(0) rotate(-6deg)'}],
    {duration:1300,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'}).onfinish=()=>{
      crown.style.opacity=1;crown.getAnimations().forEach(a=>a.cancel());crown.classList.add('landed');
      const r=crown.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.35,70);
      $('glint').classList.add('run');
    };
  spans.forEach((s,i)=>s.animate([{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],{duration:700,delay:900+i*140,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}));
  $('lead').animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:700,delay:1600,fill:'forwards'});
  $('cue').animate([{opacity:0},{opacity:1}],{duration:600,delay:2200,fill:'forwards'});
}
if(crown.complete)intro();else crown.onload=intro;

/* gift reveal */
$('giftBtn').onclick=function(){
  if(this.dataset.done)return;this.dataset.done=1;
  const b=this;b.classList.add('shake');
  setTimeout(()=>{
    const r=b.getBoundingClientRect();if(!reduce)burst(r.left+r.width/2,r.top+r.height/2,110);
    b.classList.remove('shake');b.classList.add('gone');
    setTimeout(()=>{b.style.display='none';$('tapHint').style.display='none';$('gift-sub').textContent='매니저님께 보내는 초대의 글입니다.';$('letter').classList.add('show');if(CONFIG.secretDress)$('dcBg').classList.add('show')},reduce?0:420);
  },reduce?0:600);
};
</script>
